<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Online presence - abbyw.net</title>

	<link rel="stylesheet" href="css/retro.css">
	<script src="js/retro.js" defer></script>
	<script src="js/presence.js" defer></script>
</head>

<body class="retro">

	<div class="site">

		<div class="mascot">
			<div class="bubble">have you tried giving up and using hard drugs?</div>
			<img src="assets/satur.png" alt="saturn mascot" class="mascot-img">
		</div>

		<div class="main">

			<div class="toplinks">
				<a class="theme-switch" href="classic.html">old version</a>
				<a class="theme-switch" href="https://mure.moe/feed">global chat v2.0</a>
			</div>

			<nav class="tabs">
				<a class="tab" href="index.html">Home</a>
				<a class="tab" href="page1.html">About Me</a>
				<a class="tab" href="page2.html">My Projects</a>
				<a class="tab" href="page3.html">Gallery of stuff i'v made</a>
				<a class="tab active" href="page4.html">Online Presences</a>
			</nav>

			<div class="panel">

				<h1 class="ask">online presence;</h1>

				<div class="page-box">
										<div class="presence">
						<div class="presence-user">
							<img id="pfp" class="pfp" alt="discord avatar">
							<div>
								<div class="presence-name" id="discordName">loading...</div>
								<div class="presence-status"><span class="status-dot" id="statusDot"></span><span id="statusText">connecting to discord...</span></div>
								<div class="presence-small" id="customStatus"></div>
								<div class="presence-small" id="activityText"></div>
							</div>
						</div>
						<div class="spotify" id="spotify">
							<img id="albumArt" class="album-art" alt="album art">
							<div class="spotify-info">
								<div class="spotify-label">listening to spotify</div>
								<a id="songName" class="song-name" target="_blank" rel="noopener"></a>
								<div id="songArtist"></div>
								<div class="spotify-bar"><div class="spotify-fill" id="songFill"></div></div>
							</div>
						</div>
						<div class="presence-small" id="spotifyOff">not listening to anything rn!! :3</div>
					</div>
				</div>

			</div>

		</div>

	</div>

</body>
</html>
